name: Avisar a las guías

# Las guías de https://github.com/rpolverini/learning-with-octopus describen este código.
# Cuando cambia algo que ellas explican, se abre (o se actualiza) una issue para revisarlas.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ui/**"
      - "capabilities/**"
      - "scripts/**"
      - "Cargo.toml"
      - "tauri.conf.json"
      - ".github/workflows/**"
      - "!.github/workflows/lessons-reminder.yml"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Revisar las guías de Learning With Octopus";
            const sha = context.sha.slice(0, 7);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const subject = context.payload.head_commit.message.split("\n")[0];
            const line = `- [\`${sha}\`](${url}): ${subject}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const issue = open.find((i) => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: line });
            } else {
              const body = [
                "Cambió código que las guías explican.",
                "",
                "1. En [learning-with-octopus](https://github.com/rpolverini/learning-with-octopus) corré `scripts/verify.sh` para ver qué cambió.",
                "2. Actualizá las guías que lo describen.",
                "3. Corré `scripts/verify.sh --mark` para actualizar el commit de referencia.",
                "4. Cerrá esta issue.",
                "",
                "Cambios desde la última revisión:",
                line,
              ].join("\n");
              await github.rest.issues.create({ ...context.repo, title, body });
            }
